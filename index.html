<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
/* ============ CONFIG: yahan apni keys paste karo ============ */
window.CONFIG = {
  keys: { alphaVantage: "PASTE_ALPHA_VANTAGE_KEY", fmp: "PASTE_FMP_KEY", finnhub: "", currency: "" },
  /* Login: sirf 2 users. Password plain nahi, SHA-256 hash hai.
     Hash banane ke liye browser console me chalao:
     crypto.subtle.digest("SHA-256",new TextEncoder().encode("TERA_PASSWORD")).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
     Default passwords: user1 = Demo@123 , user2 = Demo@456  (jaldi badlo) */
  users: { user1: "ff96673205dc722320598ebf8f88325b2ac56922d5a2164b5765868274bc0d73", user2: "55cad7b964da084ed67aa4189cb95170ee00995006d488619c9723484881518a" },
  balance: 10000, riskPct: 1, dailyLossPct: 3,
  symbols: [
    { name: "XAU/USD", tv: "OANDA:XAUUSD", from: "XAU", to: "USD", base: 2650, dp: 2 },
    { name: "EUR/USD", tv: "FX:EURUSD", from: "EUR", to: "USD", base: 1.085, dp: 5 },

</script>
<style>
:root{--bg:#0b1018;--s1:#121a26;--s2:#18222f;--ln:#243142;--tx:#e8edf5;--mu:#8a98ac;--br:#d9b36a;--up:#3dd68c;--dn:#f0616d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.lbox{width:min(380px,100%);background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:28px}
.lbox h1{margin:0 0 4px;font-size:24px;font-weight:600}
.lbox p{margin:0 0 20px;color:var(--mu)}
input{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:11px 12px;color:var(--tx);font:inherit;margin-bottom:10px}
.btn{background:var(--br);color:#1a1405;border:0;border-radius:8px;padding:11px 16px;font-weight:600;width:100%}
#err{color:var(--dn);min-height:20px;margin-top:8px;font-size:13px}
#app{display:none;max-width:1400px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:600;font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;color:var(--mu);transition:.15s}
.tab.on{color:var(--tx);border-color:var(--br)}
.mode{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--ln);border-radius:999px;padding:3px;min-width:270px}
.mode button{position:relative;z-index:1;background:none;border:0;padding:8px 10px;border-radius:999px;color:var(--mu);transition:color .2s}
.mode button.on{color:#10141b;font-weight:600}
.mode i{position:absolute;top:3px;bottom:3px;width:calc(33.33% - 2px);border-radius:999px;background:var(--mu);transition:transform .28s cubic-bezier(.3,.8,.3,1),background .28s}
.mode[data-m="1"] i{transform:translateX(100%);background:var(--br)}
.mode[data-m="2"] i{transform:translateX(200%);background:var(--up)}
.who{color:var(--mu);font-size:13px}
.who button{background:none;border:0;color:var(--br);padding:0 0 0 8px}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:600}
#tv{height:480px;border-radius:12px;overflow:hidden;border:1px solid var(--ln);margin-bottom:14px}
.big{font-size:26px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--s2)}
.pill.b{color:var(--up)}.pill.s{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);font-weight:500;text-align:left;padding:6px 4px}
td{padding:6px 4px;border-top:1px solid var(--ln)}
.wrap{overflow-x:auto}
.filters{display:flex;gap:6px;margin-bottom:8px}
.filters button{background:var(--s2);border:1px solid var(--ln);border-radius:6px;padding:3px 10px;color:var(--mu);font-size:12px}
.filters button.on{color:var(--tx);border-color:var(--br)}
.lock{background:#3a1d22;border:1px solid var(--dn);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<section id="login">
  <div class="lbox">
    <h1>Signal desk</h1><p>Sign in to open your trading dashboard.</p>
    <input id="u" placeholder="Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="go">Sign in</button><div id="err"></div>
  </div>
</section>

<main id="app">
  <header>
    <div class="brand">Signal desk <span class="pill">Demo data</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="mode" id="mode" data-m="0"><i></i>
      <button data-m="0" class="on">Bot off</button><button data-m="1">Signals only</button><button data-m="2">Auto (paper)</button>
    </div>
    <div class="who"><span id="me"></span><button id="out">Sign out</button></div>
  </header>
  <div class="lock" id="lock"></div>
  <div class="grid">
    <div>
      <div id="tv"></div>
      <div class="card"><h2>Open and pending trades</h2><div class="wrap"><table><thead><tr><th>Pair</th><th>Side</th><th>Entry</th><th>SL</th><th>TP1</th><th>TP2</th><th>Status</th><th>P/L</th></tr></thead><tbody id="open"></tbody></table></div></div>
      <div class="card"><h2>Closed trades</h2><div class="wrap"><table><thead><tr><th>Pair</th><th>Side</th><th>Result</th><th>P/L</th></tr></thead><tbody id="hist"></tbody></table></div></div>
    </div>
    <div>
      <div class="card"><h2>Signal</h2><div id="sig"></div></div>
      <div class="card"><h2>Account (paper)</h2><div id="acc"></div></div>
      <div class="card"><h2>News mood</h2><div id="news" class="mu">Loading...</div></div>
      <div class="card"><h2>Economic calendar</h2>
        <div class="filters" id="flt"><button data-f="all" class="on">All</button><button data-f="High">High</button><button data-f="Medium">Medium</button><button data-f="Low">Low</button></div>
        <div id="cd" style="margin-bottom:8px"></div><div id="cal"></div></div>
    </div>
  </div>
</main>

<script>
const C = window.CONFIG, $ = s => document.querySelector(s), K = C.keys;
const hex = async t => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2, "0")).join("");
let cur = 0, mode = 0, calF = "all", events = [], newsMood = 0, startBal = C.balance, bal = C.balance, dayLoss = 0;
const S = {}, SIG = {}, trades = [], closed = [];
const f = (v, d) => Number(v).toFixed(d);

/* ---------- login ---------- */
async function login() {
  const u = $("#u").value.trim(), h = await hex($("#p").value);
  if (C.users[u] && C.users[u] === h) { sessionStorage.s = u; start(u); } else $("#err").textContent = "Wrong username or password.";
}
$("#go").onclick = login; $("#p").onkeydown = e => e.key === "Enter" && login();
$("#out").onclick = () => { sessionStorage.removeItem("s"); location.reload(); };

/* ---------- market data (demo candles, anchored to live price when available) ---------- */
function gen(base, n = 140) {
  const v = base * 0.0007; let p = base, a = [], t = Date.now() - n * 9e5;
  for (let i = 0; i < n; i++) {
    const o = p, c = o + (Math.random() - .5) * v * 2 + Math.sin(i / 14) * v * .35;
    a.push({ t: t + i * 9e5, o, c, h: Math.max(o, c) + Math.random() * v * .6, l: Math.min(o, c) - Math.random() * v * .6 }); p = c;
  } return a;
}
async function livePrice(s) {
  const ck = "px_" + s.name, c = JSON.parse(localStorage[ck] || "null");
  if (c && Date.now() - c.t < 6 * 36e5) return c.p;
  if (!K.alphaVantage || K.alphaVantage.startsWith("PASTE")) return null;
  try {
    const r = await (await fetch(`https://www.alphavantage.co/query?function=CURRENCY_EXCHANGE_RATE&from_currency=${s.from}&to_currency=${s.to}&apikey=${K.alphaVantage}`)).json();
    const p = parseFloat(r["Realtime Currency Exchange Rate"]["5. Exchange Rate"]);
    if (p) { localStorage[ck] = JSON.stringify({ t: Date.now(), p }); return p; }
  } catch (e) {} return null;
}

/* ---------- SMC + price action ---------- */
function swings(c, k = 2) {
  const hi = [], lo = [];
  for (let i = k; i < c.length - k; i++) {
    let h = true, l = true;
    for (let j = 1; j <= k; j++) { if (c[i].h <= c[i - j].h || c[i].h <= c[i + j].h) h = false; if (c[i].l >= c[i - j].l || c[i].l >= c[i + j].l) l = false; }
    if (h) hi.push(i); if (l) lo.push(i);
  } return { hi, lo };
}
function analyse(c, s) {
  const n = c.length, last = c[n - 1], { hi, lo } = swings(c), lh = hi.at(-1), ll = lo.at(-1);
  const atr = c.slice(-14).reduce((a, x) => a + x.h - x.l, 0) / 14, notes = []; let dir = null, score = 0;
  if (lh != null && last.c > c[lh].h) { dir = "BUY"; notes.push("Break of structure above " + f(c[lh].h, s.dp)); score++; }
  else if (ll != null && last.c < c[ll].l) { dir = "SELL"; notes.push("Break of structure below " + f(c[ll].l, s.dp)); score++; }
  if (!dir) return { dir: null, notes: ["No clear break of structure. Market is ranging."], score: 0 };
  const from = dir === "BUY" ? ll : lh; let ob = null;
  for (let i = n - 2; i >= from; i--) if (dir === "BUY" ? c[i].c < c[i].o : c[i].c > c[i].o) { ob = c[i]; break; }
  if (!ob) return { dir: null, notes: ["Break found but no order block to trade from."], score: 0 };
  notes.push("Order block " + f(ob.l, s.dp) + " to " + f(ob.h, s.dp)); score++;
  const swept = c.slice(from + 1).some(x => dir === "BUY" ? (x.l < c[ll].l && x.c > c[ll].l) : (x.h > c[lh].h && x.c < c[lh].h));
  if (swept) { notes.push("Liquidity sweep before the move"); score++; }
  let fvg = false;
  for (let i = Math.max(2, n - 30); i < n; i++) if (dir === "BUY" ? c[i].l > c[i - 2].h : c[i].h < c[i - 2].l) fvg = true;
  if (fvg) { notes.push("Fair value gap in the move direction"); score++; }
  if ((newsMood > .15 && dir === "BUY") || (newsMood < -.15 && dir === "SELL")) { notes.push("News mood agrees"); score++; }
  const entry = (ob.h + ob.l) / 2, sl = dir === "BUY" ? ob.l - atr * .25 : ob.h + atr * .25, R = Math.abs(entry - sl), m = dir === "BUY" ? 1 : -1;
  return { dir, entry, sl, tp1: entry + m * 2 * R, tp2: entry + m * 3 * R, score, notes, id: Date.now() };
}

/* ---------- ticks, signals, paper bot ---------- */
function newsLock() {
  const now = Date.now(), e = events.find(x => x.impact === "High" && Math.abs(x.t - now) < 30 * 6e4);
  return e || null;
}
function recalc(name) {
  const s = C.symbols.find(x => x.name === name), a = analyse(S[name], s), old = SIG[name];
  if (a.dir && a.score >= 3) { if (!old || old.dir !== a.dir) { SIG[name] = a; autoTrade(name, a); } }
  else if (!a.dir) SIG[name] = { dir: null, notes: a.notes };
}
function autoTrade(name, g) {
  if (mode !== 2 || newsLock() || dayLoss <= -C.dailyLossPct / 100 * startBal) return;
  if (trades.some(t => t.sym === name)) return;
  trades.push({ sym: name, dir: g.dir, entry: g.entry, sl: g.sl, tp1: g.tp1, tp2: g.tp2, risk: bal * C.riskPct / 100, st: "Pending", half: false, real: 0 });
}
function manage(name, p) {
  for (const t of [...trades]) if (t.sym === name) {
    const B = t.dir === "BUY";
    if (t.st === "Pending") {
      if ((B && p <= t.entry) || (!B && p >= t.entry)) t.st = "Open";
      else if ((B && p <= t.sl) || (!B && p >= t.sl)) trades.splice(trades.indexOf(t), 1);
      continue;
    }
    const hitSL = B ? p <= t.sl : p >= t.sl, hit1 = B ? p >= t.tp1 : p <= t.tp1, hit2 = B ? p >= t.tp2 : p <= t.tp2;
    if (hit2) close(t, t.real + 1.5 * t.risk, "TP2");
    else if (hitSL) close(t, t.half ? t.real : -t.risk, t.half ? "Break-even" : "Stop loss");
    else if (hit1 && !t.half) { t.half = true; t.real = t.risk; t.sl = t.entry; }
    t.pl = t.half ? t.real : (B ? p - t.entry : t.entry - p) / Math.abs(t.entry - t.sl) * t.risk;
  }
}
function close(t, pl, why) {
  trades.splice(trades.indexOf(t), 1); closed.unshift({ sym: t.sym, dir: t.dir, why, pl }); bal += pl; dayLoss += pl;
  if (dayLoss <= -C.dailyLossPct / 100 * startBal) setMode(0);
}
let tickN = 0;
function tick() {
  tickN++;
  for (const s of C.symbols) {
    const c = S[s.name], l = c.at(-1), v = s.base * .00035; let p = l.c + (Math.random() - .5) * v;
    if (tickN % 20 === 0) { c.push({ t: Date.now(), o: l.c, c: p, h: Math.max(l.c, p), l: Math.min(l.c, p) }); if (c.length > 200) c.shift(); recalc(s.name); }
    else { l.c = p; l.h = Math.max(l.h, p); l.l = Math.min(l.l, p); }
    manage(s.name, p);
  } render();
}

/* ---------- news + calendar ---------- */
async function loadNews() {
  const ck = "news", c = JSON.parse(localStorage[ck] || "null");
  if (c && Date.now() - c.t < 6 * 36e5) { newsMood = c.m; return; }
  if (K.alphaVantage.startsWith("PASTE")) return;
  try {
    const r = await (await fetch(`https://www.alphavantage.co/query?function=NEWS_SENTIMENT&topics=economy_macro,financial_markets&limit=30&apikey=${K.alphaVantage}`)).json();
    const a = (r.feed || []).map(x => parseFloat(x.overall_sentiment_score)).filter(x => !isNaN(x));
    if (a.length) { newsMood = a.reduce((x, y) => x + y, 0) / a.length; localStorage[ck] = JSON.stringify({ t: Date.now(), m: newsMood }); }
  } catch (e) {}
}
async function loadCal() {
  const d = x => new Date(x).toISOString().slice(0, 10), t = Date.now();
  if (!K.fmp.startsWith("PASTE")) try {
    const r = await (await fetch(`https://financialmodelingprep.com/api/v3/economic_calendar?from=${d(t)}&to=${d(t + 2 * 864e5)}&apikey=${K.fmp}`)).json();
    if (Array.isArray(r) && r.length) { events = r.filter(x => x.country === "US" || x.country === "EU" || x.country === "GB").map(x => ({ t: Date.parse(x.date.replace(" ", "T") + "Z"), name: x.event, cur: x.country, impact: x.impact || "Low", fc: x.estimate, pv: x.previous, ac: x.actual })).sort((a, b) => a.t - b.t); return; }
  } catch (e) {}
  const m = 6e4; events = [["Core CPI m/m", "USD", "High", 50 * m], ["FOMC member speaks", "USD", "Medium", 3 * 36e5], ["German Ifo index", "EUR", "Medium", 5 * 36e5], ["Jobless claims", "USD", "Low", 20 * 36e5]].map(x => ({ t: t + x[3], name: x[0], cur: x[1], impact: x[2], fc: "-", pv: "-", ac: null }));
}

/* ---------- render ---------- */
function render() {
  const s = C.symbols[cur], g = SIG[s.name], p = S[s.name].at(-1).c, d = s.dp;
  const lk = newsLock(); $("#lock").style.display = lk ? "block" : "none"; if (lk) $("#lock").textContent = "News lock: " + lk.name + " is close. The bot will not open new trades.";
  $("#sig").innerHTML = `<div class="row"><span class="mu">Demo price</span><span class="num">${f(p, d)}</span></div>` + (g && g.dir ?
    `<div class="big ${g.dir === "BUY" ? "up" : "dn"}">${g.dir === "BUY" ? "Buy" : "Sell"} <span class="pill ${g.dir === "BUY" ? "b" : "s"}">${g.score}/5 confluence</span></div>
     <div class="row"><span>Entry</span><b class="num">${f(g.entry, d)}</b></div><div class="row"><span>Stop loss</span><b class="num dn">${f(g.sl, d)}</b></div>
     <div class="row"><span>Take profit 1 (2R)</span><b class="num up">${f(g.tp1, d)}</b></div><div class="row"><span>Take profit 2 (3R)</span><b class="num up">${f(g.tp2, d)}</b></div>
     <div class="mu" style="margin-top:8px">${g.notes.join("<br>")}</div>` : `<div class="mu">${g ? g.notes.join("<br>") : "Waiting for the first candle close."}</div>`);
  const open = trades.reduce((a, t) => a + (t.pl || 0), 0), pc = x => (x >= 0 ? "up" : "dn");
  $("#acc").innerHTML = `<div class="row"><span>Balance</span><b class="num">${f(bal, 2)}</b></div><div class="row"><span>Floating P/L</span><b class="num ${pc(open)}">${f(open, 2)}</b></div><div class="row"><span>Today</span><b class="num ${pc(dayLoss)}">${f(dayLoss, 2)}</b></div><div class="row"><span>Win rate</span><b>${closed.length ? Math.round(closed.filter(x => x.pl > 0).length / closed.length * 100) + "%" : "-"}</b></div>`;
  $("#open").innerHTML = trades.map(t => { const q = C.symbols.find(x => x.name === t.sym).dp; return `<tr><td>${t.sym}</td><td class="${t.dir === "BUY" ? "up" : "dn"}">${t.dir}</td><td class="num">${f(t.entry, q)}</td><td class="num">${f(t.sl, q)}</td><td class="num">${f(t.tp1, q)}</td><td class="num">${f(t.tp2, q)}</td><td>${t.st}</td><td class="num ${pc(t.pl || 0)}">${f(t.pl || 0, 2)}</td></tr>`; }).join("") || `<tr><td colspan="8" class="mu">No trades yet. Switch to Auto (paper) and wait for a signal.</td></tr>`;
  $("#hist").innerHTML = closed.slice(0, 15).map(t => `<tr><td>${t.sym}</td><td class="${t.dir === "BUY" ? "up" : "dn"}">${t.dir}</td><td>${t.why}</td><td class="num ${pc(t.pl)}">${f(t.pl, 2)}</td></tr>`).join("") || `<tr><td colspan="4" class="mu">Closed trades will show here.</td></tr>`;
  const nm = newsMood > .15 ? ["Bullish", "up"] : newsMood < -.15 ? ["Bearish", "dn"] : ["Neutral", "mu"];
  $("#news").innerHTML = `<span class="${nm[1]}" style="font-size:20px;font-weight:600">${nm[0]}</span> <span class="num mu">(${f(newsMood, 2)})</span>`;
  const nx = events.find(e => e.t > Date.now() && e.impact === "High"), ms = nx ? nx.t - Date.now() : 0;
  $("#cd").innerHTML = nx ? `Next high impact: <b>${nx.name}</b> in <b class="num">${Math.floor(ms / 36e5)}h ${Math.floor(ms % 36e5 / 6e4)}m ${Math.floor(ms % 6e4 / 1e3)}s</b>` : "No high impact event ahead.";
  $("#cal").innerHTML = `<div class="wrap"><table><tbody>` + events.filter(e => calF === "all" || e.impact === calF).slice(0, 10).map(e => `<tr><td class="num mu">${new Date(e.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</td><td>${e.cur}</td><td>${e.name}</td><td class="${e.impact === "High" ? "dn" : "mu"}">${e.impact}</td><td class="num mu">F ${e.fc ?? "-"} / A ${e.ac ?? "-"}</td></tr>`).join("") + `</tbody></table></div>`;
}
function setMode(m) { mode = m; const e = $("#mode"); e.dataset.m = m; e.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.m === m)); }
$("#mode").onclick = e => { const b = e.target.closest("button"); if (b) setMode(+b.dataset.m); };
$("#flt").onclick = e => { const b = e.target.closest("button"); if (!b) return; calF = b.dataset.f; $("#flt").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render(); };
function chart() {
  $("#tv").innerHTML = ""; const mk = () => new TradingView.widget({ autosize: true, symbol: C.symbols[cur].tv, interval: "15", theme: "dark", style: "1", locale: "en", hide_side_toolbar: false, container_id: "tv" });
  if (window.TradingView) mk(); else { const s = document.createElement("script"); s.src = "https://s3.tradingview.com/tv.js"; s.onload = mk; document.head.appendChild(s); }
}
async function start(u) {
  $("#login").style.display = "none"; $("#app").style.display = "block"; $("#me").textContent = u;
  $("#tabs").innerHTML = C.symbols.map((s, i) => `<button class="tab ${i ? "" : "on"}" data-i="${i}">${s.name}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; cur = +b.dataset.i; $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); chart(); render(); };
  for (const s of C.symbols) { const p = await livePrice(s); if (p) s.base = p; S[s.name] = gen(s.base); }
  await Promise.all([loadNews(), loadCal()]);
  C.symbols.forEach(s => recalc(s.name)); chart(); render(); setInterval(tick, 1500);
}
if (sessionStorage.s) start(sessionStorage.s);
</script>
